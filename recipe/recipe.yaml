context:
  version: "1.1.0"
  python_min: "3.10"

package:
  name: microbench
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/microbench/microbench-${{ version }}.tar.gz
  sha256: d9acbeaa657720815e17f1480d709f389394de7e9d03203a979e9bd45c477365

build:
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation
  noarch: python
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - microbench
      python_version: ${{ python_min }}.*
  - script:
      - pip check
      - pytest microbench/tests/
    requirements:
      run:
        - pip
        - pytest
        - pytest-cov
        - pandas
        - numpy
        - line_profiler
        - psutil
        - python ${{ python_min }}.*
    files:
      source:
        - .

about:
  homepage: https://github.com/alubbock/microbench
  summary: Micro-benchmarking framework. Extensible, with distributed/cluster support.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - julian-belina
