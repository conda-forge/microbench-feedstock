{% set name = "microbench" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/alubbock/microbench/archive/v{{ version }}.tar.gz
  sha256: 5d2d52550114f93bcb4f86014cc44e69e6e88e70d1eb17ca92565c8a09d3b317

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=2.6
    - pip
    - setuptools
  run:
    - python >=2.6
    - setuptools

test:
  imports:
    - microbench
  commands:
    - pip check
    - ls
    - pytest microbench/tests/
  source_files:
    - .
  requires:
    - pip
    - pytest
    - pandas
    - line_profiler
    - psutil

about:
  home: https://github.com/alubbock/microbench
  summary: Micro-benchmarking framework. Extensible, with distributed/cluster support.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - julian-belina
