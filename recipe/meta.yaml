{% set name = "microbench" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/alubbock/microbench/archive/v{{ version }}.tar.gz
  sha256: 9a576047f28c31872a55dde113daca22ebfe3473524eb2ed5bd6f157af75570c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=2.6
    - pip
    - setuptools
  run:
    - python >=2.6
    - setuptools

test:
  imports:
    - microbench
  commands:
    - pip check
    - ls
    - pytest microbench/tests/
  source_files:
    - .
  requires:
    - pip
    - pytest
    - pandas
    - line_profiler
    - psutil

about:
  home: https://github.com/alubbock/microbench
  summary: Micro-benchmarking framework. Extensible, with distributed/cluster support.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - julian-belina
